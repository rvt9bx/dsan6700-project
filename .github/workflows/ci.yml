name: ci
run-name: ${{ github.actor }} is doing continuous integration validation.
on: [push, pull_request]
# Every action is pinned to a commit hash (the tag it came from is in the comment), so a moved
# or deleted tag cannot change what runs here
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4.2.0
        with:
          version: "0.11.6" # same uv as the Dockerfile

      - name: Run uv sync
        run: uv sync --frozen --all-extras

      - name: Run ruff linting and formatting
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Run mypy type check
        run: uv run mypy src/

      - name: Run tests
        run: uv run pytest

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository with full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0 # gitleaks scans every commit, not just the latest

      - name: Scan Git history for secrets with gitleaks
        # The official image, pinned by digest; --redact keeps any secret it finds out of the log.
        # Git in the container must trust /repo, which another user owns: without safe.directory it
        # reads no commits, and gitleaks still reports "no leaks found"
        run: >-
          docker run --rm -v "$PWD:/repo"
          -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --redact --verbose

  # Builds the image only after the tests pass, smoke-tests it, and publishes it to the GitHub
  # Container Registry under the commit's hash. Pull requests build and test but never publish:
  # only code merged to main reaches the registry
  image:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Build the image
        # The source label links the package to this repository on GitHub
        run: >-
          docker build
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          --label org.opencontainers.image.revision=${{ github.sha }}
          -t "$IMAGE" .

      - name: Smoke-test the image
        # /health checks no dependencies, so the image can be tested alone, without Qdrant
        run: |
          docker run -d --name smoke -p 8080:8080 "$IMAGE"
          for attempt in $(seq 1 30); do
            curl -fs http://localhost:8080/health | grep -q '"ok"' && break
            sleep 2
          done
          curl -fsS http://localhost:8080/health | grep -q '"ok"' || { docker logs smoke; exit 1; }
          curl -fsS -o /dev/null http://localhost:8080/ || { docker logs smoke; exit 1; }
          echo "Smoke test passed: /health is ok and the UI loads"

      - name: Log in to the GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Publish the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push "$IMAGE"

