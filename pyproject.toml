[project]
name = "movierec"
version = "0.1.0"
description = "A package for solo or group semantic movie recommendations."
authors = [
    { name = "Eleanor Byrd" },
    { name = "Erin Brzusek" },
    { name = "Noelle Martell" },
    { name = "Nkemdibe Okweye" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.146.0",
    "fastembed>=0.9.1",
    "fastparquet>=2026.9.0",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "qdrant-client>=1.20.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/movierec"]

[dependency-groups]
datacollection = [
    "fastparquet>=2026.9.0",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "requests>=2.34.2",
]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[project.scripts]
movierec-ingest = "movierec.retrieval.ingest:main"

