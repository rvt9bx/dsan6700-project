# Settings shared by app and ingest. Set here rather than in .env so the containers always find each other,
# whatever .env says; these values override .env
x-movierec-env: &movierec-env
  QDRANT_URL: http://qdrant:6333                # the service name below, not localhost
  EMBED_CACHE_DIR: /models
  MOVIES_PATH: /data/clean/tmdb_movies.parquet

services:
  app:
    build: .
    image: movierec:latest
    env_file:
      - path: .env
        required: false                         # a fresh clone runs on defaults; copy .env.example to .env to override
    environment:
      <<: *movierec-env
      LOG_DIR: /logs
    ports:
      - "8080:8080"                             # the only port we publish
    volumes:
      - models:/models                          # embedding weights, downloaded once, shared with ingest
      - logs:/logs                              # usage events survive restarts and rebuilds
    depends_on:
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0                # pinned to match qdrant-client 1.20.0 in uv.lock
    volumes:
      - qdrant-storage:/qdrant/storage          # vectors survive restarts, rebuilds and unshelving
    # no ports: reachable by app and ingest on the Compose network, never from the internet
    healthcheck:                                # the image has no curl or wget; bash opens the connection itself
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # One-shot job: embeds the movie Parquet into Qdrant, then exits. Not started by `docker compose up`;
  # run it on purpose with `docker compose run --rm ingest` (add --limit 100 for a quick test)
  ingest:
    build: .
    image: movierec:latest                      # the same image as app, with a different command
    entrypoint: ["movierec-ingest"]
    profiles: [ingest]
    env_file:
      - path: .env
        required: false
    environment: *movierec-env
    volumes:
      - models:/models
      - ./data:/data:ro                         # put tmdb_movies.parquet in data/clean/ first
    depends_on:
      qdrant:
        condition: service_healthy

  # Collects the app's /metrics every 15 s (monitoring/prometheus/prometheus.yml). Its config can't read
  # environment variables, so the entrypoint writes METRICS_TOKEN to a file the config points at.
  # No depends_on app: Prometheus starts fine without it and shows the target as down until it is up
  prometheus:
    image: prom/prometheus:v3.5.0
    entrypoint:
      - /bin/sh
      - -c
      - >-
        printf '%s' "$$METRICS_TOKEN" > /tmp/metrics_token &&
        exec /bin/prometheus
        --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=30d
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}          # from .env; must match the app's
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus             # 30 days of history, enough for the 28-day SLO window
    ports:
      - "127.0.0.1:9090:9090"                   # this machine only; reach it over an SSH tunnel
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Dashboards. The data source and the dashboard are files in monitoring/grafana, loaded at startup
  grafana:
    image: grafana/grafana:12.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}   # set it in .env on the instance
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/movierec.json
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana           # users and settings survive restarts
    ports:
      - "127.0.0.1:3000:3000"                   # this machine only; reach it over an SSH tunnel
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      prometheus:
        condition: service_healthy
    restart: unless-stopped

volumes:
  models:
  logs:
  qdrant-storage:
  prometheus-data:
  grafana-data:
